<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <div class="header-nav">
                <a class="site-logo" href="/">{{ site.title }}</a>
                <!-- Tombol Sakelar Tema Modern -->
                <button id="theme-toggle" class="theme-btn" aria-label="Ubah Tema">🌓 Mode</button>
            </div>
            <p class="site-desc">{{ site.description }}</p>
        </div>
    </header>

    <main class="site-main">
        <article class="post-content">
            {{ content }}
        </article>
    </main>

    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Powered by Jekyll.</p>
    </footer>

    <!-- JAVASCRIPT UNTUK RESPONSIVE THEME TOGGLE -->
    <script>
        const toggleButton = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        // 1. Cek preference tema awal di browser/sistem
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        
        // 2. Tentukan tema aktif saat pertama kali dibuka
        if (currentTheme === 'dark' || (!currentTheme && prefersDark.matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleButton.innerHTML = "🌙 Night";
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            toggleButton.innerHTML = "☀️ Light";
        }

        // 3. Fungsi saat tombol sakelar diklik
        toggleButton.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                toggleButton.innerHTML = "☀️ Light";
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleButton.innerHTML = "🌙 Night";
            }
        });
    </script>
</body>
</html>
